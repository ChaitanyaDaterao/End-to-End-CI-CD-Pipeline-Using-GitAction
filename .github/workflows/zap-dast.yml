name: OWASP ZAP DAST Scan

on:
  workflow_run:
    workflows: ["Deploy to Kubernetes (Helm)"]
    types:
      - completed
  workflow_dispatch:

jobs:
  zap_scan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get minikube node target
        id: target
        run: |
          IP=$(minikube ip)
          echo "url=http://$IP:30080" >> "$GITHUB_OUTPUT"

      - name: ZAP Baseline Scan
        run: |
          docker run --rm -v $(pwd):/zap/wrk/:rw --network=host \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t ${{ steps.target.outputs.url }} \
            -J report_json.json -w report_md.md -r report_html.html \
            -a || true

      - name: Print scan summary
        run: |
          echo "## ZAP Scan Results" >> $GITHUB_STEP_SUMMARY
          cat report_md.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No report generated" >> $GITHUB_STEP_SUMMARY
