apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-{{ .Values.client.name }}
  labels:
    app: {{ .Values.client.name }}
    {{- include "murum.labels" . | nindent 4 }}
spec:
  type: {{ .Values.client.service.type }}
  selector:
    app: {{ .Values.client.name }}
    release: {{ .Release.Name }}
  ports:
    - port: {{ .Values.client.service.port }}
      targetPort: {{ .Values.client.port }}
      protocol: TCP
      {{- if and (eq .Values.client.service.type "NodePort") .Values.client.service.nodePort }}
      nodePort: {{ .Values.client.service.nodePort }}
      {{- end }}
