apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.server.name }}
  labels:
    app: {{ .Values.server.name }}
    {{- include "murum.labels" . | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app: {{ .Values.server.name }}
    release: {{ .Release.Name }}
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
